name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run AirCoreChecks
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Qingping-Air
          path: dist/Qingping-Air.zip
